# Blueprint Render — Location App (Node + MySQL Clever Cloud)
# À placer à la racine du dépôt GitHub, puis « New > Blueprint » sur Render.
services:
  - type: web
    name: location-app
    runtime: node
    plan: free
    region: frankfurt
    branch: master
    autoDeploy: true
    buildCommand: npm --prefix backend install
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Valeurs à saisir dans le tableau de bord Render (sync: false)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "false"
      - key: DB_POOL_SIZE
        value: "2"
      # Identité de l'instance (branding par client)
      - key: APP_NAME
        sync: false
      - key: APP_SHORT_NAME
        sync: false
      - key: APP_COMPANY_NAME
        sync: false
      - key: APP_TAGLINE
        sync: false
      - key: APP_URL
        sync: false
      - key: CLIENT_SLUG
        sync: false
      - key: APP_DEFAULT_LANGUAGE
        value: fr
      - key: APP_LOCALE
        value: fr-FR
      - key: APP_CURRENCY
        value: USD
      - key: APP_CURRENCY_SYMBOL
        value: "$"
      - key: APP_TIMEZONE
        value: Africa/Kinshasa
      - key: APP_PRIMARY_COLOR
        value: "#4f46e5"
      - key: APP_ACCENT_COLOR
        value: "#14b8a6"
      - key: APP_THEME_COLOR
        value: "#0b1220"
      - key: APP_BACKGROUND_COLOR
        value: "#000000"
      - key: APP_LOGO_URL
        sync: false
      - key: APP_ICON_192_URL
        sync: false
      - key: APP_ICON_512_URL
        sync: false
      - key: APP_ICON_MASKABLE_URL
        sync: false
      - key: APP_APPLE_ICON_URL
        sync: false
      - key: APP_FAVICON_URL
        sync: false
      # Firebase Admin (privé) et Firebase Web (public) par client
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_WEB_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_WEB_PROJECT_ID
        sync: false
      - key: FIREBASE_WEB_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_WEB_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_WEB_APP_ID
        sync: false
      - key: FIREBASE_VAPID_KEY
        sync: false
      # Les fichiers sont persistés en base MySQL : aucun disque Render requis.
