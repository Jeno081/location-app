<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Location App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <i data-lucide="home" style="width:24px;height:24px;vertical-align:-5px;margin-right:6px;color:var(--primary);"></i>Location App
    </div>
    <nav>
      <a href="index.html"><i data-lucide="arrow-left" style="width:18px;height:18px;vertical-align:-4px;margin-right:4px;"></i>Accueil</a>
    </nav>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h1><i data-lucide="log-in" style="width:28px;height:28px;vertical-align:-5px;margin-right:8px;color:var(--primary);"></i>Connexion</h1>
      <p class="auth-subtitle">Accédez à votre espace personnel</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Adresse email</label>
          <input type="email" id="email" name="email" placeholder="exemple@email.com" required>
        </div>

        <div class="form-group">
          <label for="mot_de_passe">Mot de passe</label>
          <input type="password" id="mot_de_passe" name="mot_de_passe" placeholder="Votre mot de passe" required>
        </div>

        <button type="submit" class="btn-primary btn-block">
          <i data-lucide="log-in" style="width:20px;height:20px;vertical-align:-5px;margin-right:6px;"></i>Se connecter
        </button>
      </form>

      <div id="message" class="message"></div>

      <p class="auth-footer" style="margin-top:25px;text-align:center;color:var(--gray-500);font-size:0.85rem;">
        <i data-lucide="info" style="width:16px;height:16px;vertical-align:-3px;margin-right:5px;"></i>
        Pas encore de compte ? Contactez le bailleur pour obtenir vos identifiants.
      </p>
    </div>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/login.js"></script>
  <script>
    if (typeof lucide !== "undefined") lucide.createIcons();
  </script>
</body>
</html>
