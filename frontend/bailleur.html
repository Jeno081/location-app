<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Bailleur — Location App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">🏠 Location App</div>
    <nav>
      <span id="userName" class="user-badge"></span>
      <button onclick="logout()" class="btn-secondary">Déconnexion</button>
    </nav>
  </header>

  <main class="dashboard">
    <div class="dashboard-header">
      <h1>Mon espace bailleur</h1>
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <button class="btn-secondary" onclick="openContractModal()">📄 Créer un contrat</button>
        <button class="btn-primary" onclick="openPropertyModal()">+ Ajouter un logement</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="statTotal">0</div>
        <div class="stat-label">Logements</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statDispo">0</div>
        <div class="stat-label">Disponibles</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statLoyer">0 $</div>
        <div class="stat-label">Revenu mensuel</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statEncaisse">0 $</div>
        <div class="stat-label">Total encaissé</div>
      </div>
    </div>

    <h2 class="section-title">Mes logements</h2>
    <div id="propertiesList" class="properties-grid">
      <p class="empty-message">Chargement...</p>
    </div>

    <h2 class="section-title" style="margin-top: 60px;">Mes contrats</h2>
    <div id="contractsList" class="properties-grid">
      <p class="empty-message">Chargement...</p>
    </div>

    <h2 class="section-title" style="margin-top: 60px;">Paiements reçus</h2>
    <div id="paymentsList" class="properties-grid">
      <p class="empty-message">Chargement...</p>
    </div>

    <h2 class="section-title" style="margin-top: 60px;">Incidents signalés</h2>
    <div id="incidentsList" class="properties-grid">
      <p class="empty-message">Chargement...</p>
    </div>
  </main>

  <!-- Modale logement -->
  <div id="propertyModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closePropertyModal()">&times;</span>
      <h2>Ajouter un logement</h2>
      <form id="propertyForm">
        <div class="form-group">
          <label for="titre">Titre</label>
          <input type="text" id="titre" placeholder="Ex : Appartement 2 chambres" required>
        </div>
        <div class="form-group">
          <label for="adresse">Adresse</label>
          <input type="text" id="adresse" placeholder="Ex : 12 Avenue de la Paix" required>
        </div>
        <div class="form-group">
          <label for="ville">Ville</label>
          <input type="text" id="ville" placeholder="Ex : Kinshasa">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="loyer">Loyer ($)</label>
            <input type="number" id="loyer" placeholder="350" required min="0">
          </div>
          <div class="form-group">
            <label for="charges">Charges ($)</label>
            <input type="number" id="charges" placeholder="50" min="0" value="0">
          </div>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="3" placeholder="Décrivez le logement..."></textarea>
        </div>
        <div class="form-group">
          <label for="photos">Photos (max 5)</label>
          <input type="file" id="photos" accept="image/*" multiple>
        </div>
        <button type="submit" class="btn-primary btn-block">Créer le logement</button>
      </form>
      <div id="propertyMessage" class="message"></div>
    </div>
  </div>

  <!-- Modale contrat -->
  <div id="contractModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeContractModal()">&times;</span>
      <h2>Créer un contrat de location</h2>
      <form id="contractForm">
        <div class="form-group">
          <label for="contractProperty">Logement</label>
          <select id="contractProperty" required>
            <option value="">-- Choisir --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="contractLocataire">Email du locataire</label>
          <input type="email" id="contractLocataire" placeholder="locataire@email.com" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="contractDebut">Date de début</label>
            <input type="date" id="contractDebut" required>
          </div>
          <div class="form-group">
            <label for="contractFin">Date de fin (optionnel)</label>
            <input type="date" id="contractFin">
          </div>
        </div>
        <div class="form-group">
          <label for="contractMontant">Montant du loyer ($)</label>
          <input type="number" id="contractMontant" placeholder="350" required min="0">
        </div>
        <button type="submit" class="btn-primary btn-block">Créer le contrat</button>
      </form>
      <div id="contractMessage" class="message"></div>
    </div>
  </div>

  <script src="js/bailleur.js"></script>
</body>
</html>
