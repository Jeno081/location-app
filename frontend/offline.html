<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Location App">
  <title>Hors ligne — Location App</title>
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 0%, #eef2ff 0, #f4f5fa 48%, #eef0f7 100%);
      color: #0f172a;
    }
    .card {
      width: min(440px, 100%); background: #fff; border: 1px solid #e5e7eb;
      border-radius: 24px; padding: 34px 28px; text-align: center;
      box-shadow: 0 24px 60px rgba(15, 23, 42, .12);
    }
    .logo { width: 76px; height: 76px; margin: 0 auto 18px; display: block; border-radius: 18px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: #64748b; font-size: .9rem; line-height: 1.6; margin: 0 0 22px; }
    button {
      width: 100%; border: 0; border-radius: 12px; padding: 13px 18px;
      background: #4f46e5; color: #fff; font-size: .9rem; font-weight: 800; cursor: pointer;
    }
    button:hover { background: #4338ca; }
    .hint { margin-top: 16px; font-size: .72rem; color: #94a3b8; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/icons/icon-192.png" alt="Location App">
    <h1>Vous êtes hors ligne</h1>
    <p>Vérifiez votre connexion internet puis réessayez. Vos données restent en sécurité.<br><span lang="en">You are offline. Check your connection and try again.</span></p>
    <button type="button" onclick="window.location.reload()">Réessayer / Retry</button>
    <p class="hint">Location App — Gestion locative</p>
  </main>
</body>
</html>
