<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Locataire — Location App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">🏠 Location App</div>
    <nav>
      <span id="userName" class="user-badge"></span>
      <button onclick="logout()" class="btn-secondary">Déconnexion</button>
    </nav>
  </header>

   <main class="dashboard">
    <div class="dashboard-header">
      <h1>Logements disponibles</h1>
      <input type="text" id="searchInput" placeholder="🔍 Rechercher par ville ou titre..." class="search-input">
    </div>

    <div id="propertiesList" class="properties-grid">
      <p class="empty-message">Chargement...</p>
    </div>

    <!-- Section Mes signalements -->
    <h2 class="section-title" style="margin-top: 60px;">Mes signalements</h2>
    <div id="incidentsList" class="properties-grid">
      <p class="empty-message">Chargement...</p>
    </div>
  </main>

  <!-- Modale pour signaler un incident -->
  <div id="incidentModal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="closeIncidentModal()">&times;</span>
      <h2>Signaler un problème</h2>

      <form id="incidentForm">
        <div class="form-group">
          <label for="incidentDescription">Décrivez le problème</label>
          <textarea id="incidentDescription" rows="4" placeholder="Ex : Fuite d'eau dans la salle de bain..." required></textarea>
        </div>

        <input type="hidden" id="incidentPropertyId">

        <button type="submit" class="btn-primary btn-block">Envoyer le signalement</button>
      </form>

      <div id="incidentMessage" class="message"></div>
    </div>
  </div>

  <script src="js/locataire.js"></script>
</body>
</html>
