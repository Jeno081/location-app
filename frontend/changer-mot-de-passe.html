<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Changer le mot de passe — Location App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">🏠 Location App</div>
    <nav>
      <button onclick="logout()" class="btn-secondary">Déconnexion</button>
    </nav>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h1>🔒 Changez votre mot de passe</h1>
      <p class="auth-subtitle">
        Pour votre sécurité, vous devez définir un mot de passe personnel avant de continuer.
      </p>

      <form id="changeForm">
        <div class="form-group">
          <label for="ancien">Mot de passe temporaire (reçu du bailleur)</label>
          <input type="password" id="ancien" placeholder="Votre mot de passe actuel" required>
        </div>

        <div class="form-group">
          <label for="nouveau">Nouveau mot de passe</label>
          <input type="password" id="nouveau" placeholder="Au moins 6 caractères" required minlength="6">
        </div>

        <div class="form-group">
          <label for="confirm">Confirmer le nouveau mot de passe</label>
          <input type="password" id="confirm" placeholder="Retapez le nouveau mot de passe" required minlength="6">
        </div>

        <button type="submit" class="btn-primary btn-block">Valider le nouveau mot de passe</button>
      </form>

      <div id="message" class="message"></div>
    </div>
  </main>

  <script src="js/changer-mot-de-passe.js"></script>
</body>
</html>
