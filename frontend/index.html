<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location App — Votre logement en toute simplicité</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="home-body">

  <div class="home-hero">

    <div class="home-content">
            <div class="home-logo"><i data-lucide="home" style="width:80px;height:80px;stroke-width:1.5;"></i></div>
      <h1 class="home-title">Location App</h1>
      <p class="home-subtitle" id="textBienvenue">
        Votre logement, géré en toute simplicité.
      </p>

      <div class="home-actions">
        <a href="login.html" class="btn-home-primary">
          <i data-lucide="log-in"></i> Se connecter
        </a>
        <a href="register.html" id="btnInscription" class="btn-home-secondary" style="display:none;">
          <i data-lucide="user-plus"></i> Créer le compte bailleur
        </a>
      </div>

      <div class="home-features">
        <div class="home-feature">
          <i data-lucide="file-text" style="width:32px;height:32px;"></i>
          <p>Contrats en ligne</p>
        </div>
        <div class="home-feature">
          <i data-lucide="credit-card" style="width:32px;height:32px;"></i>
          <p>Paiements simplifiés</p>
        </div>
        <div class="home-feature">
          <i data-lucide="wrench" style="width:32px;height:32px;"></i>
          <p>Signalements rapides</p>
        </div>
      </div>
    </div>

  
    
  </div>
  <script src="js/icons.js"></script>
  <script src="js/animations.js"></script>
  <script>
    if (typeof lucide !== "undefined") lucide.createIcons();
  </script>
  <script src="js/index.js"></script>
    
</body>
</html>
